<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cruise ship sailing on the sea at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071a2e"/>
      <stop offset="0.45" stop-color="#0d3a54"/>
      <stop offset="0.72" stop-color="#0b5f78"/>
      <stop offset="1" stop-color="#0788a8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a4a63"/>
      <stop offset="1" stop-color="#07253b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dff7fb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dff7fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0c1f30"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f6fa"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#cfeef6" opacity="0.7">
    <circle cx="180" cy="120" r="2"/><circle cx="330" cy="70" r="1.6"/>
    <circle cx="520" cy="150" r="2.2"/><circle cx="760" cy="60" r="1.6"/>
    <circle cx="980" cy="130" r="2"/><circle cx="1210" cy="80" r="1.8"/>
    <circle cx="1380" cy="170" r="2"/><circle cx="1500" cy="90" r="1.5"/>
    <circle cx="250" cy="220" r="1.4"/><circle cx="690" cy="200" r="1.5"/>
    <circle cx="1080" cy="210" r="1.6"/>
  </g>

  <!-- Moon glow -->
  <circle cx="1230" cy="185" r="210" fill="url(#moon)" opacity="0.55"/>
  <circle cx="1230" cy="185" r="52" fill="#eafbfd" opacity="0.96"/>

  <!-- Distant islands -->
  <path d="M-40 470 Q 180 380 380 460 L 380 520 -40 520 Z" fill="#0a2540" opacity="0.85"/>
  <path d="M1340 480 Q 1500 420 1700 470 L 1700 520 1340 520 Z" fill="#0a2540" opacity="0.85"/>

  <!-- Far sea -->
  <rect x="0" y="470" width="1600" height="70" fill="#0a4a63" opacity="0.9"/>

  <!-- Ship superstructure -->
  <g>
    <!-- Main deck (white) -->
    <path d="M330 610 L470 540 L1120 540 L1270 610 Z" fill="url(#deck)"/>
    <!-- Hull -->
    <path d="M250 610 L320 610 L1330 610 L1390 640 Q1430 700 1380 760 L250 760 Q185 700 250 610 Z" fill="url(#hull)"/>
    <!-- Bridge block -->
    <rect x="560" y="420" width="130" height="120" rx="8" fill="#f4fbfd"/>
    <rect x="590" y="350" width="70" height="70" rx="6" fill="#eaf6fa"/>
    <!-- Bridge windows -->
    <g fill="#0b5f78" opacity="0.85">
      <rect x="575" y="452" width="16" height="20" rx="2"/><rect x="600" y="452" width="16" height="20" rx="2"/>
      <rect x="625" y="452" width="16" height="20" rx="2"/><rect x="650" y="452" width="16" height="20" rx="2"/>
    </g>
    <!-- Funnel -->
    <rect x="1185" y="330" width="70" height="160" rx="8" fill="#eaf6fa"/>
    <rect x="1196" y="346" width="48" height="58" rx="6" fill="#087ea4"/>
    <!-- Railing -->
    <line x1="470" y1="540" x2="1120" y2="540" stroke="#cfeef6" stroke-width="4"/>
    <g stroke="#cfeef6" stroke-width="2" opacity="0.7">
      <line x1="480" y1="535" x2="480" y2="555"/><line x1="560" y1="528" x2="560" y2="548"/>
      <line x1="700" y1="540" x2="700" y2="560"/><line x1="900" y1="540" x2="900" y2="560"/>
      <line x1="1050" y1="540" x2="1050" y2="558"/>
    </g>
    <!-- Cabin windows -->
    <g fill="#78cfe3" opacity="0.9">
      <circle cx="700" cy="588" r="8"/><circle cx="760" cy="588" r="8"/><circle cx="820" cy="588" r="8"/>
      <circle cx="880" cy="588" r="8"/><circle cx="940" cy="588" r="8"/><circle cx="1000" cy="588" r="8"/>
    </g>
    <!-- Lifeboats -->
    <g>
      <ellipse cx="620" cy="600" rx="26" ry="11" fill="#0b5f78"/>
      <ellipse cx="500" cy="600" rx="26" ry="11" fill="#ffb454"/>
      <ellipse cx="370" cy="604" rx="24" ry="11" fill="#0b5f78"/>
    </g>
    <!-- Bow -->
    <path d="M1155 540 L1120 540 L1200 440 L1215 460 Z" fill="#f4fbfd"/>
  </g>

  <!-- Sea (front) -->
  <path d="M0 650 L1600 610 L1600 900 L0 900 Z" fill="url(#sea)"/>

  <!-- Waves -->
  <g fill="none" stroke="#4fb9d1" stroke-width="5" opacity="0.55" stroke-linecap="round">
    <path d="M0 700 Q 50 685 100 700 T 200 700 T 300 700 T 400 700"/>
    <path d="M440 730 Q 490 715 540 730 T 640 730 T 740 730"/>
    <path d="M820 760 Q 870 745 920 760 T 1020 760 T 1120 760"/>
    <path d="M0 800 Q 60 785 120 800 T 240 800 T 360 800 T 480 800"/>
    <path d="M540 830 Q 600 815 660 830 T 780 830 T 900 830"/>
    <path d="M960 855 Q 1020 842 1080 855 T 1200 855 T 1320 855"/>
    <path d="M0 870 Q 80 857 160 870 T 320 870 T 480 870 T 640 870"/>
  </g>
  <g fill="#1d7f99" opacity="0.35">
    <ellipse cx="420" cy="750" rx="220" ry="34"/>
    <ellipse cx="1180" cy="820" rx="240" ry="30"/>
  </g>
</svg>